[package]
name = "onepaint"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "onepaint: a native raster painting app"

[lints]
workspace = true

[dependencies]
onepaint-engine = { workspace = true }
onepaint-gpu = { workspace = true }
onepaint-ui-kit = { workspace = true }
onepaint-color = { workspace = true }
onepaint-doc = { workspace = true }
onepaint-brush = { workspace = true }
onepaint-stroke = { workspace = true }
onepaint-input = { workspace = true }
onepaint-raster = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
rayon = { workspace = true }
rfd = "0.17"
directories = "6"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
onepaint-formats = { workspace = true }
onepaint-selection = { workspace = true }
onepaint-filters = { workspace = true }
onepaint-text = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }
