[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.95"

[workspace.dependencies]
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
openh264 = "0.9"
onepaint-raster = { path = "crates/raster" }
onepaint-color = { path = "crates/color" }
onepaint-doc = { path = "crates/doc" }
onepaint-compose = { path = "crates/compose" }
onepaint-history = { path = "crates/history" }
onepaint-stroke = { path = "crates/stroke" }
onepaint-brush = { path = "crates/brush" }
onepaint-input = { path = "crates/input" }
onepaint-formats = { path = "crates/formats" }
onepaint-gpu = { path = "crates/gpu" }
onepaint-engine = { path = "crates/engine" }
onepaint-ui-kit = { path = "crates/ui_kit" }
onepaint-selection = { path = "crates/selection" }
onepaint-filters = { path = "crates/filters" }
onepaint-text = { path = "crates/text" }
onepaint-panel = { path = "crates/panel" }

thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "pnm"] }
jpeg-encoder = "0.6"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
half = { version = "2", features = ["bytemuck"] }
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
egui_kittest = "0.36"
wgpu = { version = "30", default-features = false }
pollster = "0.4"
proptest = "1"
criterion = { version = "0.5", default-features = false }

[workspace.lints.rust]
# deny, not forbid: AGENTS.md allows unsafe per module with a SAFETY comment.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Lean debug builds: the disk is tight, and painting must stay usable in debug.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
